<script type="module">
/* ── error surface ──────────────────────────────────────────────── */

function fail(e) {
  errBox.style.display = 'block';

  console.error(e);
}

addEventListener('unhandledrejection', ev => fail(ev.reason));

/* ── three, with CDN fallback ───────────────────────────────────── */

  THREE = await import('https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js');
} catch (e) {

const rimL = new THREE.DirectionalLight(0x8fb8ff, 1.9); rimL.position.set(-2.2, 1.6, -2.0); scene.add(rimL);

/* ═══════════════════════════ 2. SHADER (shared uniforms) ═══════════════════════════ */

const U = {
  uTouch:   { value: new THREE.Vector3(0, -9, 0) },
  uAmount:  { value: 0 },
  uRadius:  { value: 0.11 },
  uOrifice0:{ value: new THREE.Vector3(0, -9, 0) },
  uAxis0:   { value: new THREE.Vector3(0, 0, 1) },
  uOpen0:   { value: 0 },
  uSpread0: { value: 0.034 },
  uOrifice1:{ value: new THREE.Vector3(0, -9, 0) },
  uAxis1:   { value: new THREE.Vector3(0, 0, 1) },
  uOpen1:   { value: 0 },
  uSpread1: { value: 0.024 }
};

function patchBody(mat) {
  mat.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, U);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `
        #include <common>
        uniform vec3  uTouch;
        uniform float uAmount;
        uniform float uRadius;
        uniform vec3  uOrifice0;
        uniform vec3  uAxis0;
        uniform float uOpen0;
        uniform float uSpread0;
        uniform vec3  uOrifice1;
        uniform vec3  uAxis1;
        uniform float uOpen1;
        uniform float uSpread1;
      `)
      .replace('#include <skinning_vertex>', `
        #include <skinning_vertex>
        {
          float dT   = distance( transformed, uTouch );
          float infl = uAmount * smoothstep( uRadius, 0.0, dT );
          transformed += normalize( transformed - uTouch + 1e-5 ) * infl * 0.042;

          /* orifice 0 — vulva: spread the inner lips, recess the walls */
          vec3  rA = transformed - uOrifice0;
          float aA = dot( rA, uAxis0 );
          vec3  pA = rA - uAxis0 * aA;
          float lA = length( pA ) + 1e-5;
          float kA = smoothstep( uSpread0, 0.0, lA ) * uOpen0;
          transformed += ( pA / lA ) * kA * uSpread0 * 1.45;
          transformed += uAxis0 * kA * uSpread0 * 1.10;

          /* orifice 1 — anus: sphincter dilation */
          vec3  rB = transformed - uOrifice1;
          float aB = dot( rB, uAxis1 );
          vec3  pB = rB - uAxis1 * aB;

          float kB = smoothstep( uSpread1, 0.0, lB ) * uOpen1;
          transformed += ( pB / lB ) * kB * uSpread1 * 1.75;
          transformed += uAxis1 * kB * uSpread1 * 1.30;
        }
      `);
  };
  mat.customProgramCacheKey = () => 'bodyShaderV3';
}

function mkMat(color, roughness, emissive) {

    color: color,
    roughness: roughness,
    side: THREE.DoubleSide,
    emissive: emissive || 0x000000,
    emissiveIntensity: 0.35
  });
  patchBody(m);
  return m;
}

  emit(k, v) { (this.m[k] || []).forEach(f => f(v)); }
};

  constructor(surface, inwardAxis, radius, maxDepth, spread, label) {
    this.surface  = new THREE.Vector3(surface[0], surface[1], surface[2]);
    this.axis     = new THREE.Vector3(inwardAxis[0], inwardAxis[1], inwardAxis[2]).normalize();
    this.radius   = radius;
    this.maxDepth = maxDepth;
    this.spread   = spread;
    this.label    = label;
    this.depth = 0; this.lateral = 0; this.engaged = false; this.speed = 0; this.open = 0;
  }
  solve(tipLocal, dt) {
    const rel   = tipLocal.clone().sub(this.surface);
    const along = rel.dot(this.axis);
    const prev  = this.depth;

    this.depth   = Math.min(Math.max(along, 0), this.maxDepth);
    this.lateral = rel.addScaledVector(this.axis, -along).length();
    this.speed   = (this.depth - prev) / Math.max(dt, 1e-4);

    const inside = this.depth > 0.0015 && this.lateral < this.radius * 2.1;
    if (inside !== this.engaged) bus.emit(inside ? 'insert' : 'withdraw', this);

    const want = inside ? Math.min(1, this.depth / (this.maxDepth * 0.35)) : 0;
    this.open += (want - this.open) * Math.min(1, dt * 9);
  }
}

  { n: 'mons',     p: [ 0.000, 0.906,  0.112], r: 0.052, a: 9 },
  { n: 'clitoris', p: [ 0.000, 0.897,  0.126], r: 0.032, a: 13 },
  { n: 'pussy',    p: [ 0.000, 0.862,  0.136], r: 0.042, a: 15 },
  { n: 'anus',     p: [ 0.000, 0.876, -0.118], r: 0.038, a: 14 },
  { n: 'hip',      p: [ 0.104, 0.948,  0.040], r: 0.075, a: 7 },
  { n: 'thigh L',  p: [-0.076, 0.700,  0.052], r: 0.072, a: 8 },
  { n: 'thigh R',  p: [ 0.076, 0.700,  0.052], r: 0.072, a: 8 },
  { n: 'glute L',  p: [-0.080, 0.888, -0.130], r: 0.072, a: 10 },
  { n: 'glute R',  p: [ 0.080, 0.888, -0.130], r: 0.072, a: 10 }
].map(z => ({
  n: z.n, r: z.r, a: z.a, inside: false,
  v: new THREE.Vector3(z.p[0], z.p[1], z.p[2])
}));

/* ═══════════════════════════ 12. AUDIO ═══════════════════════════ */

let actx = null;
function blip(freq, dur, vol) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + dur);
}
addEventListener('pointerdown', () => {
  if (!actx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx) actx = new Ctx();
  }
}, { once: true });

/* ═══════════════════════════ 13. STATE + UI ═══════════════════════════ */

const $ = id => document.getElementById(id);

const state = {
  arousal: 0, auto: false, section: true, clothes: true, pose: 0,
  thrust: { target: 0.35, pos: 0.35, vel: 0 },
  press: 0, pressTarget: 0, lastZone: '—'
};

const POSES = [
  { name: 'standing', pos: [0, 0, 0], rot: [0, 0, 0],
    cam: [0.32, 1.02, 2.15], look: [0, 0.95, 0],
    scm: [1.05, 0.90, 0.30], slook: [0, 0.88, 0.04] },
  { name: 'on back', pos: [0, 0.28, 0.72], rot: [-Math.PI / 2, 0, 0],
    cam: [0.55, 0.80, 0.90], look: [0, 0.30, -0.15],
    scm: [1.05, 0.42, -0.12], slook: [0, 0.28, -0.12] }
];

const pointer = new THREE.Vector2(0, 0);
const ray = new THREE.Raycaster();
const handTarget = new THREE.Vector3(0, 1.28, 0.34);
const handNormal = new THREE.Vector3(0, 0, 1);
const depthPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), -0.12);
const tmp = new THREE.Vector3();
const tmp2 = new THREE.Vector3();
const tmpN = new THREE.Matrix3();

function setAuto(v)    { state.auto = v;    $('bAuto').classList.toggle('on', v); }
function setSection(v) { state.section = v; $('bSect').classList.toggle('on', v); }
function setClothes(v) { state.clothes = v; clothGroup.visible = v; $('bCloth').firstChild.nodeValue = 'Clothes: ' + (v ? 'on' : 'off') + ' '; }
function setOrifice(i) { activeOrifice = i; $('bOrif').firstChild.nodeValue = 'Orifice: ' + ORIFICES[i].label + ' '; }
function setPose(i)    { state.pose = ((i % POSES.length) + POSES.length) % POSES.length; $('bPose').firstChild.nodeValue = 'Pose: ' + POSES[state.pose].name + ' '; }

$('bAuto').onclick  = () => setAuto(!state.auto);
$('bSect').onclick  = () => setSection(!state.section);
$('bOrif').onclick  = () => setOrifice((activeOrifice + 1) % ORIFICES.length);
$('bCloth').onclick = () => setClothes(!state.clothes);
$('bPose').onclick  = () => setPose(state.pose + 1);

addEventListener('pointermove', e => {
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
});
addEventListener('pointerdown', () => { state.pressTarget = 1; });
addEventListener('pointerup',   () => { state.pressTarget = 0; });
addEventListener('pointercancel', () => { state.pressTarget = 0; });
addEventListener('wheel', e => {
  state.thrust.target = Math.min(1, Math.max(0, state.thrust.target - e.deltaY * 0.0009));
}, { passive: true });

addEventListener('keydown', e => {
  if (e.code === 'Space') { setAuto(!state.auto); e.preventDefault(); }
  if (e.key === 'c') setSection(!state.section);
  if (e.key === 'o') setOrifice((activeOrifice + 1) % ORIFICES.length);
  if (e.key === 'v') setClothes(!state.clothes);
  if (e.key === 'p') setPose(state.pose + 1);
  if (e.key === 'w') state.thrust.target = Math.min(1, state.thrust.target + 0.06);
  if (e.key === 's') state.thrust.target = Math.max(0, state.thrust.target - 0.06);
});

bus.on('insert',   () => { state.arousal = Math.min(100, state.arousal + 7); blip(150, 0.18, 0.05); });
bus.on('withdraw', () => blip(110, 0.10, 0.03));

/* ═══════════════════════════ 14. UPDATE ═══════════════════════════ */

const clock = new THREE.Clock();
const q = new THREE.Quaternion();
const basisM = new THREE.Matrix4();
const tipLocal = new THREE.Vector3();
const rootInv = new THREE.Matrix4();

function update(dt) {
  const P = POSES[state.pose];
  root.position.lerp(tmp.set(P.pos[0], P.pos[1], P.pos[2]), Math.min(1, dt * 5));
  root.rotation.x += (P.rot[0] - root.rotation.x) * Math.min(1, dt * 5);
  root.updateMatrixWorld(true);

  /* hand target */
  ray.setFromCamera(pointer, camera);
  const hits = ray.intersectObjects(pickables, false);
  if (hits.length) {
    const h = hits[0];
    handTarget.copy(h.point);
    tmpN.getNormalMatrix(h.object.matrixWorld);
    handNormal.copy(h.face.normal).applyMatrix3(tmpN).normalize();
    if (handNormal.dot(ray.ray.direction) > 0) handNormal.negate();
  } else if (ray.ray.intersectPlane(depthPlane, tmp2)) {
    handTarget.copy(tmp2);
    handNormal.set(0, 0, 1);
  }

  state.press += (state.pressTarget - state.press) * Math.min(1, dt * 12);
  tmp2.copy(handTarget).addScaledVector(handNormal, -0.030 * state.press);
  hand.position.lerp(tmp2, Math.min(1, dt * 16));

  const n = handNormal.clone().normalize();
  const t = new THREE.Vector3(0, 1, 0).sub(n.clone().multiplyScalar(n.y));
  if (t.lengthSq() < 0.02) t.set(0, 0, 1);
  t.normalize();
  const bx = new THREE.Vector3().crossVectors(n, t).normalize();
  basisM.makeBasis(bx, n, t);
  hand.quaternion.slerp(q.setFromRotationMatrix(basisM), Math.min(1, dt * 10));

  rootInv.copy(root.matrixWorld).invert();
  const local = hand.position.clone().applyMatrix4(rootInv);
  U.uTouch.value.copy(local);
  U.uAmount.value = state.press * 0.85;

  for (const z of ZONES) {
    const near = local.distanceTo(z.v) < z.r + 0.045;
    if (near && !z.inside) {
      state.lastZone = z.n;
      state.arousal = Math.min(100, state.arousal + z.a * 0.55);
      blip(210 + z.a * 22, 0.12, 0.045);
    }
    z.inside = near;
  }

  if (state.auto) state.thrust.target = 0.5 + Math.sin(performance.now() * 0.0042) * 0.48;
  const th = state.thrust;
  th.vel += (th.target - th.pos) * 0.19;
  th.vel *= 0.74;
  th.pos = Math.min(1, Math.max(0, th.pos + th.vel));

  const orc = ORIFICES[activeOrifice];
  tipLocal.copy(orc.surface).addScaledVector(orc.axis, th.pos * orc.maxDepth);
  orc.solve(tipLocal, dt);

  penetrator.position.copy(tipLocal);
  penetrator.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), orc.axis);

  const other = ORIFICES[(activeOrifice + 1) % 2];
  U.uOrifice0.value.copy(orc.surface);   U.uAxis0.value.copy(orc.axis);
  U.uOpen0.value = orc.open;             U.uSpread0.value = orc.spread;
  U.uOrifice1.value.copy(other.surface); U.uAxis1.value.copy(other.axis);
  U.uOpen1.value = other.open;           U.uSpread1.value = other.spread;

  state.arousal = Math.min(100, state.arousal + Math.abs(orc.speed) * dt * 3.2);
  state.arousal *= (1 - dt * 0.055);

  camera.position.lerp(tmp.set(P.cam[0], P.cam[1], P.cam[2]), Math.min(1, dt * 4));
  camera.lookAt(P.look[0], P.look[1], P.look[2]);
  sectionCamera.position.lerp(tmp.set(P.scm[0], P.scm[1], P.scm[2]), Math.min(1, dt * 4));
  sectionCamera.lookAt(P.slook[0], P.slook[1], P.slook[2]);

  cut.copy(cutLocal).applyMatrix4(root.matrixWorld);
  capMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), cut.normal);
  capMesh.position.setFromMatrixPosition(root.matrixWorld);

  $('zone').textContent = state.lastZone;
  const a = Math.round(state.arousal);
  $('aTxt').textContent = a + '%';
  $('ab').firstChild.style.width = a + '%';
  const dp = Math.round(th.pos * 100);
  $('dTxt').textContent = dp + '%';
  $('db').firstChild.style.width = dp + '%';
}

/* ═══════════════════════════ 15. RENDER ═══════════════════════════ */

function render() {
  cut.constant += 1000;
  capMesh.visible = false;
  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, innerWidth, innerHeight);
  renderer.render(scene, camera);
  cut.constant -= 1000;

  if (!state.section) return;

  const w = innerWidth * 0.34, h = innerHeight * 0.34, pad = 16;
  capMesh.visible = true;
  sectionCamera.aspect = w / h;
  sectionCamera.updateProjectionMatrix();

  renderer.setScissorTest(true);
  renderer.setViewport(innerWidth - w - pad, pad, w, h);
  renderer.setScissor(innerWidth - w - pad, pad, w, h);
  renderer.render(scene, sectionCamera);
  renderer.setScissorTest(false);
}

/* ═══════════════════════════ 16. BOOT ═══════════════════════════ */

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

setOrifice(0);
setClothes(true);
setPose(0);
setSection(true);
setAuto(false);

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  try {
    update(dt);
    render();
  } catch (e) {
    fail(e);
    renderer.setAnimationLoop(null);
  }
});
</script>
